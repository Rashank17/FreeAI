[project]
name = "freeai-agent"
version = "0.1.0"
description = "Internet-grounded conversational agent with memory and answer revision support"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.1",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
search = ["duckduckgo-search>=6.1.7"]
dev = ["pytest>=8.2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
